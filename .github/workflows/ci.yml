name: CI

on:
  push:
    branches: [master, staging, development]
    tags: ['v*']
  pull_request:
    branches: [master, staging]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run unit tests
        run: dotnet test tests/FlightKS.UnitTests --configuration Release

  service-integration-tests:
    name: Service & Integration Tests
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run service tests
        run: dotnet test tests/FlightKS.ServiceTests --configuration Release

      - name: Run integration tests
        run: dotnet test tests/FlightKS.IntegrationTests --configuration Release

  docker-build:
    name: Docker Build, Push & Scan
    runs-on: ubuntu-latest
    needs: [unit-tests, service-integration-tests]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # The cluster's image pull secret (ghcr-creds) is scoped to valezasutaj's
      # namespace, so publish the backend there — same place the frontend image
      # lives — instead of the repo-owner namespace the cluster can't pull from.
      - name: Set image name
        id: image
        run: echo "image=ghcr.io/valezasutaj/flightks-api" >> "$GITHUB_OUTPUT"

      # Authenticate as valezasutaj; the auto GITHUB_TOKEN cannot write to another
      # account's packages. GHCR_PAT is a classic PAT with write:packages.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: valezasutaj
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Report-only: findings still upload to the Security tab (see step
          # below), but base-image/runtime CVEs we can't fix won't block deploys.
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build
    # Continuous deployment to the live namespace — only from the default branch.
    # Skips cleanly if the KUBE_CONFIG secret isn't configured.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm upgrade (project-09)
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "::warning::KUBE_CONFIG secret not set — skipping deploy."
            exit 0
          fi
          echo "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          helm upgrade --install flightks ./helm/flightks -n project-09 \
            --reset-then-reuse-values \
            --set publicScheme=https \
            --set ingress.tls.enabled=true \
            --set ingress.tls.secretName=flightks-tls \
            --set ingress.annotations."cert-manager\.io/issuer"=letsencrypt \
            --set backend.image.repository=ghcr.io/valezasutaj/flightks-api \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=latest \
            --wait --timeout 8m
          rm -f "$RUNNER_TEMP/kubeconfig"

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [docker-build, deploy]
    if: always() && github.event_name == 'push'
    steps:
      - name: Post pipeline result to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD: ${{ needs.docker-build.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping notify."
            exit 0
          fi
          if [ "$BUILD" = "success" ] && { [ "$DEPLOY" = "success" ] || [ "$DEPLOY" = "skipped" ]; }; then
            STATUS="succeeded ✅"
          else
            STATUS="failed ❌ (build=$BUILD, deploy=$DEPLOY)"
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="FlightKS API · CI on ${{ github.ref_name }} ${STATUS} · $(echo "$GITHUB_SHA" | cut -c1-7) · ${RUN_URL}"
          PAYLOAD=$(jq -nc --arg t "$TEXT" '{text: $t}')
          curl -sf -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
