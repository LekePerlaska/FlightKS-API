{{- if .Values.podDisruptionBudget.enabled }}
{{- /* Keep the stateless tiers available during node drains / voluntary disruptions. */}}
{{- range $component := list "backend" "frontend" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "flightks.fullname" $ }}-{{ $component }}
  namespace: {{ include "flightks.namespace" $ }}
  labels:
    {{- include "flightks.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "flightks.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
