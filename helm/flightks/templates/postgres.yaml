{{/*
PostgreSQL StatefulSet. Hosts two databases on one instance:
  - {{ .Values.postgres.database }}        (the application DB; created by POSTGRES_DB)
  - {{ .Values.postgres.keycloakDatabase }} (Keycloak's DB; created by the init script below)
The init ConfigMap runs only on first boot (when the data dir is empty), so the
keycloak database is created exactly once. Persistence is via volumeClaimTemplates
(no standalone PVC template needed). The headless Service gives the StatefulSet
its stable network identity; clients reach it by name.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flightks.postgres.fullname" . }}-init
  namespace: {{ include "flightks.namespace" . }}
  labels:
    {{- include "flightks.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
data:
  10-create-keycloak-db.sql: |
    CREATE DATABASE {{ .Values.postgres.keycloakDatabase }};
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flightks.postgres.fullname" . }}
  namespace: {{ include "flightks.namespace" . }}
  labels:
    {{- include "flightks.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "flightks.postgres.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "flightks.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "flightks.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      serviceAccountName: {{ include "flightks.serviceAccountName" . }}
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "flightks.secretName" . }}
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flightks.secretName" . }}
                  key: postgres-password
            # Keep PGDATA in a subdirectory of the mount to avoid lost+found clashes.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d {{ .Values.postgres.database }}"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d {{ .Values.postgres.database }}"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: init
          configMap:
            name: {{ include "flightks.postgres.fullname" . }}-init
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "flightks.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.storageClassName }}
        storageClassName: {{ .Values.postgres.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flightks.postgres.fullname" . }}
  namespace: {{ include "flightks.namespace" . }}
  labels:
    {{- include "flightks.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "flightks.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
