{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flightks.serviceAccountName" . }}
  namespace: {{ include "flightks.namespace" . }}
  labels:
    {{- include "flightks.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No workload in this chart calls the Kubernetes API, so the token is never mounted.
automountServiceAccountToken: false
{{- end -}}
