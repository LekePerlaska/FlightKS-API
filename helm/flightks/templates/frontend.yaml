apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flightks.frontend.fullname" . }}
  namespace: {{ include "flightks.namespace" . }}
  labels:
    {{- include "flightks.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0    # never drop below desired count → zero-downtime
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "flightks.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "flightks.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: {{ include "flightks.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "flightks.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.securityContext.pod | nindent 8 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext.container | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.frontend.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            # SSR / route handlers call the API in-cluster via the service DNS.
            - name: API_INTERNAL_BASE_URL
              value: "http://{{ include "flightks.backend.fullname" . }}:{{ .Values.backend.port }}/api/v1"
            # NEXT_PUBLIC_* are baked into the client bundle at image build time
            # (relative /api/v1, empty Keycloak URL → window.location.origin), so
            # the same image is origin-portable. Passed again here only for any
            # server-side reads; changing them at runtime won't alter the bundle.
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "/api/v1"
            - name: NEXT_PUBLIC_KEYCLOAK_URL
              value: ""
            - name: NEXT_PUBLIC_KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: NEXT_PUBLIC_KEYCLOAK_CLIENT_ID
              value: {{ .Values.config.keycloak.frontendClientId | quote }}
            - name: NEXT_PUBLIC_POSTHOG_HOST
              value: {{ .Values.frontend.posthogHost | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flightks.frontend.fullname" . }}
  namespace: {{ include "flightks.namespace" . }}
  labels:
    {{- include "flightks.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "flightks.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
      protocol: TCP
