{{/*
Sensitive material: passwords and the Keycloak admin client secret.
Values here are PLACEHOLDERS — override at install time (see values.yaml).

The full DB connection string is intentionally NOT stored here. The backend
assembles it from the individual user/password keys via $(VAR) references in
its deployment, so the real password lives in exactly one place (this Secret).

Set `secrets.create: false` to bring your own Secret named "<fullname>-secrets"
with the same keys (e.g. SealedSecrets or an external secrets operator).
*/}}
{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flightks.secretName" . }}
  namespace: {{ include "flightks.namespace" . }}
  labels:
    {{- include "flightks.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-user: {{ .Values.secrets.postgresUser | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  keycloak-admin-user: {{ .Values.secrets.keycloakAdminUser | quote }}
  keycloak-admin-password: {{ .Values.secrets.keycloakAdminPassword | quote }}
  keycloak-admin-client-secret: {{ .Values.secrets.keycloakAdminClientSecret | quote }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
{{- end -}}
