apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flightks.backend.fullname" . }}
  namespace: {{ include "flightks.namespace" . }}
  labels:
    {{- include "flightks.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0    # never drop below desired count → zero-downtime
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "flightks.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "flightks.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "flightks.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "flightks.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.securityContext.pod | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext.container | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          # Non-sensitive config (Section__Key keys bind to appsettings options).
          envFrom:
            - configMapRef:
                name: {{ include "flightks.configName" . }}
          env:
            - name: DOTNET_USE_POLLING_FILE_WATCHER
              value: "true"
            # Credentials from the Secret. These must be declared BEFORE the
            # connection strings below so Kubernetes can resolve the $(VAR) refs.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "flightks.secretName" . }}
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flightks.secretName" . }}
                  key: postgres-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flightks.secretName" . }}
                  key: redis-password
            - name: Keycloak__AdminClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ include "flightks.secretName" . }}
                  key: keycloak-admin-client-secret
            # Assembled from the secret-backed vars above — the real password
            # never appears in the ConfigMap or values.yaml.
            - name: ConnectionStrings__DefaultConnection
              value: "Host={{ include "flightks.postgres.fullname" . }};Port={{ .Values.postgres.port }};Database={{ .Values.postgres.database }};Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"
            - name: RateLimiting__RedisConnectionString
              value: "{{ include "flightks.redis.fullname" . }}:{{ .Values.redis.port }},password=$(REDIS_PASSWORD)"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flightks.backend.fullname" . }}
  namespace: {{ include "flightks.namespace" . }}
  labels:
    {{- include "flightks.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "flightks.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
