services:
  nginx:
    image: nginx:1.27-alpine
    # Edge proxy: single public origin on :80 that routes / -> frontend, /api & /hubs -> api,
    # and the Keycloak paths -> keycloak. Part of the default stack so the app works at
    # http://localhost out of the box (and mirrors how a K8s Ingress will route in prod).
    ports:
      - "80:80"
      # TLS (443) is intentionally not configured yet. Add an HTTPS server block
      # + certificates here later, or terminate TLS at a Kubernetes Ingress.
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - flightks-net

  frontend:
    build:
      context: C:/Users/Valeza/Desktop/flightks-client/flightks-client
      dockerfile: Dockerfile
      args:
        # Relative so the browser calls the same origin it was served from (the edge).
        # signalr-client derives /hubs from this too. Portable across dev/prod.
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        # Empty → Keycloak adapter uses window.location.origin (the edge). Portable.
        NEXT_PUBLIC_KEYCLOAK_URL: ""
        NEXT_PUBLIC_KEYCLOAK_REALM: flightks
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: flightks-client
        NEXT_PUBLIC_POSTHOG_KEY: ""
        NEXT_PUBLIC_POSTHOG_HOST: https://app.posthog.com
        API_INTERNAL_BASE_URL: http://api:5194/api/v1
    image: flightks-client:local
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - API_INTERNAL_BASE_URL=http://api:5194/api/v1
      - NEXT_PUBLIC_API_BASE_URL=/api/v1
      - NEXT_PUBLIC_KEYCLOAK_URL=
      - NEXT_PUBLIC_KEYCLOAK_REALM=flightks
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=flightks-client
      - NEXT_PUBLIC_SIGNALR_URL=http://localhost
      - NEXT_PUBLIC_POSTHOG_KEY=
      - NEXT_PUBLIC_POSTHOG_HOST=https://app.posthog.com
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - flightks-net

  api:
    build: .
    ports:
      - "5194:5194"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5194
      - ASPNETCORE_HTTP_PORTS=5194

      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=flightks;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

      - Loki__Uri=http://loki:3100

      # Public issuer (the edge origin) that tokens carry and the API validates against.
      - Keycloak__Authority=http://localhost/realms/flightks
      # Internal discovery/JWKS address — reachable from the API over the compose network.
      # Keycloak (KC_HOSTNAME + backchannel-dynamic) keeps the issuer at the public URL above.
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/flightks/.well-known/openid-configuration
      # Backchannel base for token/logout calls (API → Keycloak directly, not via the nginx edge).
      - Keycloak__InternalAuthority=http://keycloak:8080/realms/flightks
      - Keycloak__RequireHttpsMetadata=false
      - Keycloak__Audience=flightks-api
      - Keycloak__AdminApiBaseUrl=http://keycloak:8080/admin/realms/flightks
      - Keycloak__AdminClientId=${KEYCLOAK_ADMIN_CLIENT_ID}
      - Keycloak__AdminClientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - Keycloak__FrontendClientId=${KEYCLOAK_FRONTEND_CLIENT_ID}

      - Cors__AllowedOrigins__0=http://localhost
      - Cors__AllowedOrigins__1=http://localhost:3000

      - RateLimiting__Store=Distributed
      - RateLimiting__RedisConnectionString=redis:6379,password=${REDIS_PASSWORD}


      # Trust the Docker bridge network so X-Forwarded-* headers from Nginx are accepted.
      - ForwardedHeaders__KnownNetworks__0=172.16.0.0/12

    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5194/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - flightks-net

  postgres:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: flightks
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d flightks"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flightks-net

  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER} -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flightks-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}

      # Public edge origin. Tokens are issued with iss = http://localhost/realms/flightks.
      KC_HOSTNAME: http://localhost
      # Resolve backchannel URLs (jwks_uri, token endpoint) from the request, so the API
      # fetching discovery at http://keycloak:8080 gets reachable internal URLs while the
      # issuer/frontend URLs stay at KC_HOSTNAME above. Removes the need for host rewriting.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Honor X-Forwarded-* from the nginx edge so Keycloak knows the original scheme/host/port.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"

    command: start --http-enabled=true --hostname-strict=false --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - flightks-net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - flightks-net


  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      alertmanager:
        condition: service_started
    networks:
      - flightks-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - flightks-net

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - flightks-net

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - loki
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - flightks-net

  # Uptime Kuma is configured from its UI. Suggested monitors are documented in
  # docs/uptime-kuma-monitors.md. It is exposed directly for local/admin use and
  # is not routed through the product Nginx edge proxy by default.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - flightks-net

networks:
  flightks-net:
    driver: bridge

volumes:
  postgres_data:
  keycloak_db_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  grafana_data:
  redis_data:
  uptime_kuma_data:
  dp_keys:
  uploads:
