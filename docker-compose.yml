services:
  caddy:
    image: caddy:2-alpine
    profiles: [production]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    depends_on:
      - frontend
      - api
      - keycloak
    networks:
      - flightks-net

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:5194/api/v1
      - NEXT_PUBLIC_KEYCLOAK_URL=http://localhost:8080
      - NEXT_PUBLIC_KEYCLOAK_REALM=flightks
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=flightks-client
      - NEXT_PUBLIC_SIGNALR_URL=http://localhost:5194
      - NEXT_PUBLIC_POSTHOG_KEY=
      - NEXT_PUBLIC_POSTHOG_HOST=https://app.posthog.com
    volumes:
      - ../flightks-client/flightks-client:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - api
      - keycloak
    networks:
      - flightks-net

  api:
    build: .
    ports:
      - "5194:5194"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=5194

      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=flightks;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

      - Loki__Uri=http://loki:3100

      - Keycloak__Authority=http://keycloak:8080/realms/flightks
      - Keycloak__RequireHttpsMetadata=false
      - Keycloak__Audience=flightks-api
      - Keycloak__AdminApiBaseUrl=http://keycloak:8080/admin/realms/flightks
      - Keycloak__AdminClientId=${KEYCLOAK_ADMIN_CLIENT_ID}
      - Keycloak__AdminClientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - Keycloak__FrontendClientId=${KEYCLOAK_FRONTEND_CLIENT_ID}

      - Cors__AllowedOrigins__0=http://localhost:3000

      - RateLimiting__Store=Distributed
      - RateLimiting__RedisConnectionString=redis:6379,password=${REDIS_PASSWORD}

      - SignalR__RedisConnectionString=redis:6379,password=${REDIS_PASSWORD},abortConnect=false

      # SMTP email delivery. Leave Email__Host empty to disable (NullEmailSender).
      - Email__Host=${EMAIL_HOST:-}
      - Email__Port=${EMAIL_PORT:-587}
      - Email__UseSsl=${EMAIL_USE_SSL:-true}
      - Email__Username=${EMAIL_USERNAME:-}
      - Email__Password=${EMAIL_PASSWORD:-}
      - Email__FromAddress=${EMAIL_FROM_ADDRESS:-}
      - Email__FromName=${EMAIL_FROM_NAME:-FlightKS}

    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - flightks-net

  postgres:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: flightks
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d flightks"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flightks-net

  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER} -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flightks-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}

      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"

    command: start --http-enabled=true --hostname-strict=false --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - flightks-net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - flightks-net

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - flightks-net

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - loki
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - flightks-net

networks:
  flightks-net:
    driver: bridge

volumes:
  frontend_node_modules:
  frontend_next:
  postgres_data:
  keycloak_db_data:
  loki_data:
  grafana_data:
  redis_data:
  dp_keys:
  uploads:
  caddy_data:
  caddy_config:
