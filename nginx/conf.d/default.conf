# FlightKS edge reverse proxy.
# Single host, path-based routing. Runs under the docker compose "production"
# profile. TLS/Let's Encrypt and HTTP/2 are meant to be layered on top of this
# later (or handled by a Kubernetes Ingress), so this file only listens on :80.

# Map the incoming Upgrade header to the right Connection value so WebSocket
# upgrades (SignalR /hubs and Next.js dev HMR) are proxied correctly.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Resolve upstream service names through Docker's embedded DNS at request time.
# Combined with variables in proxy_pass below, this avoids nginx caching a stale
# container IP (containers can change IP across restarts) and lets nginx start
# even if an upstream is briefly unavailable.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;

    # Forwarded headers - applied to every location. The API trusts the Docker
    # bridge network (172.16.0.0/12) for X-Forwarded-* (see Program.cs), and
    # nginx sits on that network, so the real client IP and scheme propagate.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # WebSocket upgrade headers (no-ops on ordinary HTTP requests).
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # --- Backend REST API -> api:5194 (endpoints live under /api/v1/...) ---
    location /api {
        set $api_upstream api:5194;
        proxy_pass http://$api_upstream;
    }

    # --- SignalR hubs (WebSockets) -> api:5194 ---
    # Long timeouts keep persistent hub connections from being torn down.
    location /hubs {
        set $api_upstream api:5194;
        proxy_pass http://$api_upstream;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Keycloak -> keycloak:8080 ---
    # Keycloak 17+ dropped the /auth/ root context.
    # /realms/* — OIDC/token endpoints. /resources/* and /js/* — Keycloak theme assets.
    # /admin/* is intentionally NOT proxied here: the frontend has pages under /admin/
    # and the API calls the Keycloak admin REST API directly via http://keycloak:8080.
    location ~ ^/(realms|resources|js)(/|$) {
        set $kc_upstream keycloak:8080;
        proxy_pass http://$kc_upstream;
    }

    # --- Frontend (Next.js) -> frontend:3000 (catch-all, must stay last) ---
    location / {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
    }
}
