parent=base
locales=en

styles=css/flightks.css

# Where the "Register" link on the login page points. Registration is handled by
# the FlightKS frontend, served from the same origin as Keycloak (nginx edge / ingress),
# so a root-relative path resolves correctly in both docker-compose and Kubernetes.
flightksRegisterUrl=/auth/register

# Class hooks consumed by the base FreeMarker templates so the FlightKS
# stylesheet can target every element. Empty in `base`, so we name them here.
kcHtmlClass=flightks-html
kcBodyClass=flightks-body
kcLoginClass=flightks-page
kcHeaderClass=flightks-header
kcHeaderWrapperClass=flightks-brand
kcFormCardClass=flightks-card
kcFormHeaderClass=flightks-card-header
kcContentWrapperClass=flightks-content
kcFormGroupClass=flightks-form-group
kcFormGroupErrorClass=flightks-form-group-error
kcLabelClass=flightks-label
kcLabelWrapperClass=flightks-label-wrap
kcInputWrapperClass=flightks-input-wrap
kcInputClass=flightks-input
kcInputErrorMessageClass=flightks-input-error
kcInputHelperTextBeforeClass=flightks-helper
kcInputHelperTextAfterClass=flightks-helper
kcFormOptionsClass=flightks-form-options
kcFormButtonsClass=flightks-form-buttons
kcFormSettingClass=flightks-form-setting
kcButtonClass=flightks-btn
kcButtonPrimaryClass=flightks-btn-primary
kcButtonDefaultClass=flightks-btn-default
kcButtonBlockClass=flightks-btn-block
kcButtonLargeClass=flightks-btn-lg
kcCheckboxInputClass=flightks-checkbox
kcInputGroup=flightks-input-group
kcFormPasswordVisibilityButtonClass=flightks-pw-toggle
